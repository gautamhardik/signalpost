<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGNALPOST — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: '#b8ff5b',
            bg: '#0a0a0a',
            panel: '#121212',
            borderline: '#262626',
            muted: '#737373',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar for premium feel */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    
    body { background-color: #0a0a0a; color: #ededed; }

    /* Subtle grid background for the center panel */
    .bg-grid {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    
    /* Killer Animations */
    .company-row {
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: left center;
    }
    .company-row:hover {
      transform: scale(1.02) translateX(4px);
      box-shadow: -4px 0 0 #b8ff5b;
      background: rgba(255, 255, 255, 0.05);
    }
    .btn-glow {
      position: relative;
      overflow: hidden;
    }
    .btn-glow::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%; width: 120%; height: 120%;
      background: radial-gradient(circle, rgba(184, 255, 91, 0.4) 0%, transparent 60%);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: transform 0.4s ease-out, opacity 0.4s ease-out;
      pointer-events: none;
    }
    .btn-glow:hover::after {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-sm antialiased">

  <!-- TOP NAV -->
  <nav class="h-16 border-b border-borderline bg-panel flex items-center justify-between px-6 shrink-0 z-20">
    <div class="flex items-center gap-8 flex-1">
      <div class="font-bold tracking-widest flex items-center gap-2 text-white">
        <div class="w-2 h-2 rounded-full bg-brand shadow-[0_0_8px_#b8ff5b]"></div>
        SIGNALPOST
      </div>
      <div class="relative w-full max-w-md">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" id="searchInput" placeholder="Search companies, organisation numbers..." 
               class="w-full bg-bg border border-borderline rounded-md py-1.5 pl-9 pr-4 text-sm text-gray-200 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors">
      </div>
    </div>
    <div class="flex items-center gap-6">
      <div class="font-mono text-[10px] text-muted tracking-wider" id="navMeta">LOADING WORKSPACE...</div>
      <div class="flex items-center gap-2">
        <button id="compareBtn" class="px-3 py-1.5 rounded bg-bg border border-borderline hover:border-gray-500 hover:text-white transition-colors" onclick="toggleCompareMode()">Compare</button>
        <button class="px-3 py-1.5 rounded bg-bg border border-borderline hover:border-gray-500 hover:text-white transition-colors" onclick="exportData()">Export ⬇</button>
      </div>
    </div>
  </nav>

  <!-- WORKSPACE -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- LEFT: EXPLORER -->
    <aside class="w-[320px] flex flex-col border-r border-borderline bg-panel shrink-0 z-10">
      <div class="p-4 border-b border-borderline">
        <div class="text-[10px] font-mono text-muted uppercase tracking-widest mb-3">Filters</div>
        <div class="flex flex-col gap-1">
          <button class="filter-btn active flex justify-between items-center px-3 py-1.5 rounded-md hover:bg-white/5 transition-colors text-brand bg-brand/10" onclick="setFilter('all', this)">
            <span class="font-medium text-xs">ALL</span> <span class="font-mono text-[10px]" id="f-all">0</span>
          </button>
          <button class="filter-btn flex justify-between items-center px-3 py-1.5 rounded-md hover:bg-white/5 transition-colors text-muted" onclick="setFilter('web', this)">
            <span class="font-medium text-xs text-gray-300">WEBSITE</span> <span class="font-mono text-[10px]" id="f-web">0</span>
          </button>
          <button class="filter-btn flex justify-between items-center px-3 py-1.5 rounded-md hover:bg-white/5 transition-colors text-muted" onclick="setFilter('news', this)">
            <span class="font-medium text-xs text-gray-300">NEWS</span> <span class="font-mono text-[10px]" id="f-news">0</span>
          </button>
          <button class="filter-btn flex justify-between items-center px-3 py-1.5 rounded-md hover:bg-white/5 transition-colors text-muted" onclick="setFilter('jobs', this)">
            <span class="font-medium text-xs text-gray-300">HIRING</span> <span class="font-mono text-[10px]" id="f-jobs">0</span>
          </button>
          <button class="filter-btn flex justify-between items-center px-3 py-1.5 rounded-md hover:bg-white/5 transition-colors text-muted" onclick="setFilter('none', this)">
            <span class="font-medium text-xs text-gray-300">ABSTAINED</span> <span class="font-mono text-[10px]" id="f-none">0</span>
          </button>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto" id="companyList">
        <!-- Rendered via JS -->
      </div>
    </aside>

    <!-- CENTER: INTELLIGENCE -->
    <main class="flex-1 overflow-y-auto bg-bg bg-grid relative" id="intelPanel">
      <div class="absolute inset-0 flex items-center justify-center text-muted italic">
        Select a company from the explorer to view intelligence.
      </div>
    </main>

    <!-- RIGHT: INSPECTOR -->
    <aside id="evidencePanel" class="w-[380px] flex flex-col border-l border-borderline bg-panel shrink-0 z-10 shadow-[-10px_0_30px_rgba(0,0,0,0.5)]">
      <div class="p-4 border-b border-borderline text-[11px] font-mono tracking-widest text-muted uppercase flex items-center gap-2">
        <svg class="w-4 h-4 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Evidence Inspector
      </div>
      <div class="flex-1 overflow-y-auto p-6" id="inspectorBody">
        <div class="flex flex-col items-center justify-center h-full text-center opacity-50">
          <svg class="w-12 h-12 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M10 21h7a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v11m0 5l4.879-4.879m0 0a3 3 0 104.243-4.242 3 3 0 00-4.243 4.242z"></path></svg>
          <p class="text-sm">Select an evidence item<br>to inspect claims.</p>
        </div>
      </div>
    </aside>

  </div>

  <script>
    let COMPARE_MODE = false;
    let COMPARE_LIST = [];
    let COMPANIES = [];
    let ACTIVE_FILTER = 'all';
    let ACTIVE_COMPANY = null;
    let TOTAL_EVIDENCE = 0;

    async function initApp() {
      try {
        const res = await fetch('companies.json');
        COMPANIES = await res.json();
        
        TOTAL_EVIDENCE = COMPANIES.reduce((acc, c) => {
          let count = 0;
          if (c.website) count++;
          if (c.jobs) count += c.jobs.length;
          if (c.activities) count += c.activities.length;
          if (c.changes) count += c.changes.length;
          return acc + count;
        }, 0);

        document.getElementById('navMeta').innerText = `${COMPANIES.length} COMPANIES · ${TOTAL_EVIDENCE} EVIDENCE · RUN: SUBMISSION-001`;
        
        updateFilters();
        renderExplorer();
      } catch(e) {
        console.error(e);
        document.getElementById('companyList').innerHTML = '<div class="p-4 text-red-400">Failed to load data. Is server running?</div>';
      }
    }

    function updateFilters() {
      document.getElementById('f-all').innerText = COMPANIES.length;
      document.getElementById('f-web').innerText = COMPANIES.filter(c => c.website).length;
      document.getElementById('f-news').innerText = COMPANIES.filter(c => c.activities && c.activities.length).length;
      document.getElementById('f-jobs').innerText = COMPANIES.filter(c => c.jobs && c.jobs.length).length;
      document.getElementById('f-none').innerText = COMPANIES.filter(c => !c.website && (!c.activities || !c.activities.length) && (!c.jobs || !c.jobs.length)).length;
    }

    function renderExplorer() {
      const list = document.getElementById('companyList');
      list.innerHTML = '';

      const search = document.getElementById('searchInput').value.toLowerCase();

      COMPANIES.forEach(c => {
        if (search && !c.name.toLowerCase().includes(search) && !c.organisation_number.includes(search)) return;
        if (ACTIVE_FILTER === 'web' && !c.website) return;
        if (ACTIVE_FILTER === 'news' && (!c.activities || !c.activities.length)) return;
        if (ACTIVE_FILTER === 'jobs' && (!c.jobs || !c.jobs.length)) return;
        if (ACTIVE_FILTER === 'none' && (c.website || (c.activities && c.activities.length) || (c.jobs && c.jobs.length))) return;

        let evCount = (c.website ? 1 : 0) + (c.jobs ? c.jobs.length : 0) + (c.activities ? c.activities.length : 0) + (c.changes ? c.changes.length : 0);
        let isActive = COMPARE_MODE ? COMPARE_LIST.includes(c) : ACTIVE_COMPANY === c;

        const div = document.createElement('div');
        div.className = `p-4 border-b border-borderline cursor-pointer transition-colors ${isActive ? 'bg-white/5 border-l-2 border-l-brand pl-3' : 'hover:bg-white/[0.02] border-l-2 border-l-transparent'}`;
        div.onclick = () => {
          if (COMPARE_MODE) {
            if (COMPARE_LIST.includes(c)) COMPARE_LIST = COMPARE_LIST.filter(x => x !== c);
            else if (COMPARE_LIST.length < 4) COMPARE_LIST.push(c);
            else alert('You can compare up to 4 companies at a time.');
            renderExplorer();
            renderComparison();
          } else {
            selectCompany(c);
          }
        };

        let tags = '';
        if (c.website) tags += `<span class="flex items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-blue-400"></div>Web</span>`;
        if (c.activities && c.activities.length) tags += `<span class="flex items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>News</span>`;
        if (c.jobs && c.jobs.length) tags += `<span class="flex items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-amber-400"></div>Hiring</span>`;
        if (!tags) tags = '<span class="text-gray-500">No Footprint</span>';

        div.innerHTML = `
          <div class="font-semibold text-gray-100 truncate">${c.name}</div>
          <div class="text-xs text-muted mt-1 truncate">${c.municipality || 'Unknown'}, Norway</div>
          <div class="flex gap-3 text-[10px] font-mono mt-3 text-gray-300">${tags}</div>
          <div class="text-[10px] text-muted mt-2">${evCount} evidence</div>
        `;
        list.appendChild(div);
      });

      if (typeof gsap !== "undefined") {
        gsap.fromTo(".company-row", 
          { opacity: 0, x: -10 },
          { opacity: 1, x: 0, stagger: 0.03, duration: 0.3, ease: "power2.out" }
        );
      }
    }

    function selectCompany(c) {
      ACTIVE_COMPANY = c;
      renderExplorer();
      renderIntelligence(c);
      clearInspector();
    }

    function setFilter(f, el) {
      ACTIVE_FILTER = f;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('text-brand', 'bg-brand/10', 'active');
        b.classList.add('text-muted');
        b.querySelector('span').classList.remove('text-brand');
        b.querySelector('span').classList.add('text-gray-300');
      });
      el.classList.remove('text-muted');
      el.classList.add('text-brand', 'bg-brand/10', 'active');
      el.querySelector('span').classList.remove('text-gray-300');
      el.querySelector('span').classList.add('text-brand');
      renderExplorer();
    }

    function generateExecSummary(c) {
      let sum = `${c.name} is a Norwegian ${c.legal_form === 'AS' ? 'limited company' : 'entity'} `;
      sum += c.industry_label ? `operating in the "${c.industry_label}" sector.` : 'with no verified industry classification.';
      sum += `\n\nThe company is headquartered in ${c.municipality || 'Norway'}`;
      if (c.employees) sum += ` and has ${c.employees} registered employees.`;
      else sum += `. Scale cannot be verified via public sources.`;
      const ceo = (c.roles || []).find(r => r.type === 'daglig_leder');
      if (ceo) sum += ` Executive leadership includes ${ceo.name} acting as CEO.`;
      if (c.activities && c.activities.length) {
        sum += `\n\nRecent activity indicates active operations, including an event on ${c.activities[0].activity_date}.`;
      }
      if (c.jobs && c.jobs.length) {
        sum += ` Digital footprint confirms current hiring intent with ${c.jobs.length} active position(s).`;
      }
      return sum;
    }

    function renderIntelligence(c) {
      const p = document.getElementById('intelPanel');

      const hasWeb = c.website ? {v:'✓', c:'text-emerald-400'} : {v:'—', c:'text-muted'};
      const hasReg = c.organisation_number ? {v:'✓', c:'text-emerald-400'} : {v:'—', c:'text-muted'};
      const hasNews = (c.activities && c.activities.length) ? {v:'✓', c:'text-emerald-400'} : {v:'—', c:'text-muted'};
      const hasJobs = (c.jobs && c.jobs.length) ? {v:'✓', c:'text-emerald-400'} : {v:'—', c:'text-muted'};
      const hasPpl = (c.roles && c.roles.length) ? {v:'✓', c:'text-emerald-400'} : {v:'—', c:'text-muted'};

      const ceo = (c.roles || []).find(r => r.type === 'daglig_leder');
      
      let html = `
        <div class="max-w-5xl mx-auto py-12 px-8 company-content-wrapper opacity-0">
          
          <!-- HEADER -->
          <div class="mb-10">
            <h1 class="text-4xl font-bold tracking-tight text-white mb-2">${c.name}</h1>
            <div class="text-sm text-gray-400 mb-8">${c.municipality || 'Unknown'}, Norway &middot; Org No. ${c.organisation_number}</div>
            
            <div class="flex border border-borderline rounded-lg overflow-hidden bg-white/[0.02] backdrop-blur-sm shadow-sm font-mono text-xs">
              <div class="flex-1 text-center py-3 border-r border-borderline"><div class="text-muted mb-1 uppercase tracking-wider text-[10px]">Website</div><div class="font-bold ${hasWeb.c}">${hasWeb.v}</div></div>
              <div class="flex-1 text-center py-3 border-r border-borderline"><div class="text-muted mb-1 uppercase tracking-wider text-[10px]">Registry</div><div class="font-bold ${hasReg.c}">${hasReg.v}</div></div>
              <div class="flex-1 text-center py-3 border-r border-borderline"><div class="text-muted mb-1 uppercase tracking-wider text-[10px]">News</div><div class="font-bold ${hasNews.c}">${hasNews.v}</div></div>
              <div class="flex-1 text-center py-3 border-r border-borderline"><div class="text-muted mb-1 uppercase tracking-wider text-[10px]">Hiring</div><div class="font-bold ${hasJobs.c}">${hasJobs.v}</div></div>
              <div class="flex-1 text-center py-3"><div class="text-muted mb-1 uppercase tracking-wider text-[10px]">People</div><div class="font-bold ${hasPpl.c}">${hasPpl.v}</div></div>
            </div>
          </div>

          <!-- EXECUTIVE SUMMARY -->
          <div class="mb-12">
            <h2 class="text-xs font-semibold text-muted uppercase tracking-widest border-b border-borderline pb-2 mb-4">Executive Summary</h2>
            <div class="text-[15px] leading-relaxed text-gray-200">${generateExecSummary(c).replace(/\n/g, '<br>')}</div>
          </div>

          <!-- AT A GLANCE -->
          <div class="mb-12">
            <h2 class="text-xs font-semibold text-muted uppercase tracking-widest border-b border-borderline pb-2 mb-4">At a Glance</h2>
            <div class="grid grid-cols-4 gap-4">
              <div class="p-4 rounded-lg bg-white/[0.02] border border-borderline">
                <div class="text-[10px] uppercase text-muted tracking-wider mb-2">Business</div>
                <div class="font-medium text-sm text-gray-100">${c.industry_label || 'Unknown'}</div>
              </div>
              <div class="p-4 rounded-lg bg-white/[0.02] border border-borderline">
                <div class="text-[10px] uppercase text-muted tracking-wider mb-2">Scale</div>
                <div class="font-medium text-sm text-gray-100">${c.employees ? c.employees + ' employees' : 'Not available'}</div>
              </div>
              <div class="p-4 rounded-lg bg-white/[0.02] border border-borderline">
                <div class="text-[10px] uppercase text-muted tracking-wider mb-2">Leadership</div>
                <div class="font-medium text-sm text-gray-100">${ceo ? ceo.name : 'No verified figure'}</div>
              </div>
              <div class="p-4 rounded-lg bg-white/[0.02] border border-borderline">
                <div class="text-[10px] uppercase text-muted tracking-wider mb-2">Activity</div>
                <div class="font-medium text-sm text-gray-100">${(c.activities || []).length} recent events</div>
              </div>
            </div>
          </div>

          <!-- WHAT CHANGED -->
          <div class="mb-12">
            <h2 class="text-xs font-semibold text-muted uppercase tracking-widest border-b border-borderline pb-2 mb-6">What Changed</h2>
      `;

      window.CURRENT_EVIDENCE = [];

      if (c.activities && c.activities.length) {
        html += `<div class="ml-2 border-l-2 border-borderline pl-6 space-y-8 relative">`;
        c.activities.forEach((act, idx) => {
          const evIdx = window.CURRENT_EVIDENCE.length;
          window.CURRENT_EVIDENCE.push({
            type: 'NEWS', date: act.activity_date, title: act.title, 
            source: act.source_url, retrieved: act.retrieved_at, ext: act.description, matched: true
          });
          html += `
            <div class="relative">
              <div class="absolute -left-[31px] top-1.5 w-2.5 h-2.5 rounded-full bg-bg border-[2px] border-brand shadow-[0_0_8px_rgba(184,255,91,0.5)]"></div>
              <div class="text-[11px] font-mono text-muted mb-1">${act.activity_date} &middot; News Event</div>
              <div class="text-sm font-semibold text-gray-100 mb-1">${act.title}</div>
              <div class="text-sm text-gray-400 mb-3">${act.description}</div>
              <button class="text-[11px] font-medium text-brand hover:text-white cursor-pointer inline-flex items-center gap-1 transition-colors" onclick="inspectEvidence(${evIdx})">
                View evidence &rarr;
              </button>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<div class="text-muted text-sm italic">No dated news discovered in the searched public sources.</div>`;
      }
      
      // DIGITAL FOOTPRINT & HIRING side-by-side
      html += `
          </div>
          
          <div class="grid grid-cols-2 gap-12 mb-12">
            <!-- Digital Footprint -->
            <div>
              <h2 class="text-xs font-semibold text-muted uppercase tracking-widest border-b border-borderline pb-2 mb-4">Digital Footprint</h2>
      `;
      if (c.website) {
        const evIdx = window.CURRENT_EVIDENCE.length;
        window.CURRENT_EVIDENCE.push({
          type: 'WEBSITE', date: 'Current', title: 'Official Domain', source: c.website, retrieved: 'Run time', ext: 'Domain verified via structured extraction.', matched: true
        });
        html += `
          <div class="bg-white/[0.02] border border-borderline rounded-lg p-5">
            <div class="text-xs font-semibold uppercase tracking-wider mb-2">Official Website</div>
            <div class="font-mono text-[13px] text-blue-400 mb-4 hover:underline break-all"><a href="${c.website}" target="_blank">${c.website}</a></div>
            <div class="flex items-center gap-2 text-xs text-emerald-400 mb-4">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              Company identity verified
            </div>
            <button class="text-[11px] font-medium text-brand hover:text-white cursor-pointer inline-flex items-center gap-1 transition-colors" onclick="inspectEvidence(${evIdx})">Inspect evidence &rarr;</button>
          </div>
        `;
      } else {
        html += `<div class="text-muted text-sm italic">No official website verified.</div>`;
      }
      
      html += `
            </div>
            <!-- Hiring Signals -->
            <div>
              <h2 class="text-xs font-semibold text-muted uppercase tracking-widest border-b border-borderline pb-2 mb-4">Hiring Signals</h2>
      `;
      
      if (c.jobs && c.jobs.length) {
        html += `<div class="font-bold text-gray-100 mb-4">${c.jobs.length} VERIFIED</div><div class="space-y-4">`;
        c.jobs.forEach((j, idx) => {
          const evIdx = window.CURRENT_EVIDENCE.length;
          window.CURRENT_EVIDENCE.push({
            type: 'HIRING', date: j.posted_date, title: j.title, 
            source: j.source_url, retrieved: 'Run time', ext: `Department: ${j.department}\nLocation: ${j.location}`, matched: j.identity_assessment?.verified
          });
          html += `
            <div class="bg-white/[0.02] border border-borderline rounded-lg p-4">
              <div class="text-[10px] font-mono text-muted mb-1">Posted ${j.posted_date}</div>
              <div class="text-sm font-semibold text-gray-100 mb-1">${j.title}</div>
              <div class="text-xs text-gray-400 mb-3">${j.location} &middot; ${j.department}</div>
              <div class="flex items-center gap-1.5 text-[11px] text-emerald-400 mb-3">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Identity verified
              </div>
              <button class="text-[11px] font-medium text-brand hover:text-white cursor-pointer inline-flex items-center gap-1 transition-colors" onclick="inspectEvidence(${evIdx})">Inspect &rarr;</button>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `
          <div class="text-muted text-sm italic mb-2">No verified hiring signal found.</div>
          <div class="text-[11px] text-gray-500 leading-relaxed">Official career pages checked.<br>Verified ATS sources checked.<br><br>No company-matched posting was accepted.</div>
        `;
      }
      
      html += `</div></div>`;

      // EVIDENCE TABLE
      html += `
        <div class="mb-12">
          <h2 class="text-xs font-semibold text-muted uppercase tracking-widest border-b border-borderline pb-2 mb-4">Evidence Explorer</h2>
          <div class="rounded-lg border border-borderline overflow-hidden bg-white/[0.02]">
            <table class="w-full text-left text-[13px]">
              <thead class="bg-black/20 text-[10px] font-mono uppercase text-muted">
                <tr>
                  <th class="py-3 px-4 font-medium border-b border-borderline">Type</th>
                  <th class="py-3 px-4 font-medium border-b border-borderline">Date</th>
                  <th class="py-3 px-4 font-medium border-b border-borderline">Finding</th>
                  <th class="py-3 px-4 font-medium border-b border-borderline">Source</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-borderline">
      `;
      
      if (c.website) {
        const evIdx = window.CURRENT_EVIDENCE.findIndex(e => e.type === 'WEBSITE');
        html += `<tr class="hover:bg-white/[0.04] cursor-pointer transition-colors" onclick="inspectEvidence(${evIdx})">
          <td class="py-3 px-4"><span class="px-2 py-1 rounded bg-blue-500/10 text-blue-400 text-[10px] font-mono">WEBSITE</span></td>
          <td class="py-3 px-4 text-gray-400">Current</td>
          <td class="py-3 px-4 text-gray-200">Official company site</td>
          <td class="py-3 px-4 text-muted">${new URL(c.website).hostname}</td>
        </tr>`;
      }
      
      (c.activities || []).forEach((act, idx) => {
        const evIdx = window.CURRENT_EVIDENCE.findIndex(e => e.type === 'NEWS' && e.title === act.title);
        html += `<tr class="hover:bg-white/[0.04] cursor-pointer transition-colors" onclick="inspectEvidence(${evIdx})">
          <td class="py-3 px-4"><span class="px-2 py-1 rounded bg-emerald-500/10 text-emerald-400 text-[10px] font-mono">NEWS</span></td>
          <td class="py-3 px-4 text-gray-400">${act.activity_date}</td>
          <td class="py-3 px-4 text-gray-200">${act.title}</td>
          <td class="py-3 px-4 text-muted">${new URL(act.source_url).hostname}</td>
        </tr>`;
      });
      (c.jobs || []).forEach((j, idx) => {
        const evIdx = window.CURRENT_EVIDENCE.findIndex(e => e.type === 'HIRING' && e.title === j.title);
        html += `<tr class="hover:bg-white/[0.04] cursor-pointer transition-colors" onclick="inspectEvidence(${evIdx})">
          <td class="py-3 px-4"><span class="px-2 py-1 rounded bg-amber-500/10 text-amber-400 text-[10px] font-mono">HIRING</span></td>
          <td class="py-3 px-4 text-gray-400">${j.posted_date}</td>
          <td class="py-3 px-4 text-gray-200">${j.title}</td>
          <td class="py-3 px-4 text-muted">${new URL(j.source_url).hostname}</td>
        </tr>`;
      });
      
      html += `</tbody></table></div></div>`;

      // GAPS
      let gaps = [];
      if (!c.employees) gaps.push('No verified employee count found. (NOT FOUND)');
      if (!c.website) gaps.push('No verified official domain discovered. (NOT FOUND)');
      if (!c.jobs || !c.jobs.length) gaps.push('No verified hiring signal found. (NOT APPLICABLE/NOT FOUND)');
      if (!c.activities || !c.activities.length) gaps.push('No dated news discovered in the searched public sources. (NOT FOUND)');

      if (gaps.length) {
        html += `<div class="mb-12">
          <h2 class="text-xs font-semibold text-muted uppercase tracking-widest border-b border-borderline pb-2 mb-4">Evidence Gaps</h2>
          <div class="bg-red-500/10 border border-red-500/20 rounded-lg p-5">
            <ul class="space-y-2">
        `;
        gaps.forEach(g => html += `<li class="flex items-start gap-2 text-[13px] text-red-200/80"><svg class="w-4 h-4 text-red-400/60 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> ${g}</li>`);
        html += `</ul></div></div>`;
      }

      html += `</div>`; // End max-w container
      p.innerHTML = html;
      if (typeof gsap !== "undefined") {
        gsap.to(".company-content-wrapper", {opacity: 1, duration: 0.5, ease: "power2.out"});
        gsap.fromTo(".company-content-wrapper > div", 
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, stagger: 0.1, duration: 0.5, ease: "back.out(1.2)" }
        );
      }
    }

    function inspectEvidence(idx) {
      const ev = window.CURRENT_EVIDENCE[idx];
      if (!ev) return;
      
      // Add slight highlight to inspector column
      const inspector = document.getElementById('evidencePanel');
      inspector.classList.add('bg-white/[0.02]');
      setTimeout(() => inspector.classList.remove('bg-white/[0.02]'), 300);

      const b = document.getElementById('inspectorBody');
      b.innerHTML = `
        <div class="pb-6 border-b border-borderline mb-6">
          <div class="text-[10px] font-mono text-brand mb-2 px-2 py-1 bg-brand/10 inline-block rounded">${ev.type}</div>
          <div class="text-xl font-bold text-gray-100 mb-2 leading-tight">${ev.date}</div>
          <div class="text-sm text-gray-300 leading-snug">${ev.title}</div>
        </div>

        <div class="space-y-6">
          <div>
            <div class="text-[10px] font-mono text-muted uppercase mb-1">Source</div>
            <div class="text-[13px] text-blue-400 font-mono break-all leading-tight"><a href="${ev.source}" target="_blank" class="hover:underline">${ev.source}</a></div>
          </div>

          <div>
            <div class="text-[10px] font-mono text-muted uppercase mb-1">Publication</div>
            <div class="text-sm text-gray-200">${ev.date}</div>
          </div>

          <div>
            <div class="text-[10px] font-mono text-muted uppercase mb-1">Retrieved</div>
            <div class="text-sm text-gray-200">${ev.retrieved}</div>
          </div>

          <div>
            <div class="text-[10px] font-mono text-muted uppercase mb-2">Identity</div>
            <div class="flex items-center gap-2 text-sm ${ev.matched ? 'text-emerald-400 bg-emerald-400/10' : 'text-gray-400 bg-white/5'} px-3 py-2 rounded-md break-words">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${ev.matched ? 'M5 13l4 4L19 7' : 'M20 12H4'}"></path></svg>
              ${ev.matched ? 'Exact company match' : 'Unverified match'}
            </div>
          </div>

          <div>
            <div class="text-[10px] font-mono text-muted uppercase mb-1">Extract</div>
            <div class="bg-black/30 border border-borderline rounded-md p-3 text-xs text-gray-400 italic whitespace-pre-wrap break-words overflow-wrap-anywhere leading-relaxed shadow-inner">${ev.ext}</div>
          </div>
        </div>

        <a href="${ev.source}" target="_blank" class="mt-8 flex items-center justify-center gap-2 w-full bg-white text-black hover:bg-gray-200 py-2.5 rounded-md text-sm font-semibold transition-colors break-words text-center">
          OPEN ORIGINAL SOURCE 
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </a>
      `;
    }

    function clearInspector() {
      document.getElementById('inspectorBody').innerHTML = `
        <div class="flex flex-col items-center justify-center h-full text-center opacity-50">
          <svg class="w-12 h-12 mb-4 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M10 21h7a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v11m0 5l4.879-4.879m0 0a3 3 0 104.243-4.242 3 3 0 00-4.243 4.242z"></path></svg>
          <p class="text-sm text-muted">Select an evidence item<br>to inspect claims.</p>
        </div>
      `;
    }

    function toggleCompareMode() {
      COMPARE_MODE = !COMPARE_MODE;
      COMPARE_LIST = [];
      const btn = document.getElementById('compareBtn');
      if (COMPARE_MODE) {
        btn.classList.add('bg-brand', 'text-black', 'border-brand');
        btn.classList.remove('bg-bg', 'text-white');
        renderComparison();
        clearInspector();
      } else {
        btn.classList.remove('bg-brand', 'text-black', 'border-brand');
        btn.classList.add('bg-bg', 'text-white');
        renderIntelligence(ACTIVE_COMPANY);
      }
      renderExplorer();
    }

    function renderComparison() {
      const p = document.getElementById('intelPanel');
      if (COMPARE_LIST.length === 0) {
        p.innerHTML = `<div class="absolute inset-0 flex flex-col items-center justify-center text-muted italic"><svg class="w-12 h-12 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>Select companies from the sidebar to compare their evidence.</div>`;
        return;
      }

      let html = `
        <div class="max-w-7xl mx-auto py-12 px-8">
          <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Compare Evidence</h1>
          <p class="text-sm text-gray-400 mb-8">Side-by-side verification signals</p>
          <div class="flex gap-6 overflow-x-auto pb-4">
      `;

      COMPARE_LIST.forEach(c => {
        const hasWeb = c.website ? '✓ Verified Domain' : '— Missing';
        const hasJobs = (c.jobs && c.jobs.length) ? `${c.jobs.length} verified roles` : '— No signals';
        const hasNews = (c.activities && c.activities.length) ? `${c.activities.length} news events` : '— No signals';
        const emp = c.employees ? `${c.employees} employees` : 'N/A';
        
        html += `
          <div class="flex-1 min-w-[280px] bg-white/[0.02] border border-borderline rounded-xl p-6">
            <div class="font-bold text-lg text-white truncate mb-1">${c.name}</div>
            <div class="text-[11px] text-muted font-mono mb-8 border-b border-borderline pb-4">${c.organisation_number} &middot; ${c.industry_label || 'Unknown'}</div>
            
            <div class="space-y-6 text-sm">
              <div>
                <div class="text-[10px] font-mono text-muted uppercase tracking-wider mb-2">Web Footprint</div>
                <div class="${c.website ? 'text-emerald-400' : 'text-gray-500'} font-medium flex items-center gap-1.5"><svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${c.website ? 'M5 13l4 4L19 7' : 'M20 12H4'}"></path></svg>${hasWeb}</div>
              </div>
              <div>
                <div class="text-[10px] font-mono text-muted uppercase tracking-wider mb-2">Hiring Intent</div>
                <div class="${c.jobs?.length ? 'text-amber-400' : 'text-gray-500'} font-medium">${hasJobs}</div>
              </div>
              <div>
                <div class="text-[10px] font-mono text-muted uppercase tracking-wider mb-2">Recent Activity</div>
                <div class="${c.activities?.length ? 'text-blue-400' : 'text-gray-500'} font-medium">${hasNews}</div>
              </div>
              <div>
                <div class="text-[10px] font-mono text-muted uppercase tracking-wider mb-2">Reported Scale</div>
                <div class="text-gray-200 font-medium">${emp}</div>
              </div>
            </div>
          </div>
        `;
      });

      html += `</div></div>`;
      p.innerHTML = html;
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(COMPANIES, null, 2));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href",     dataStr);
      downloadAnchorNode.setAttribute("download", "signalpost_export.json");
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    }

    document.getElementById('searchInput').addEventListener('input', renderExplorer);

    window.onload = initApp;
  </script>
</body>
</html>
